# assetmap 深度测绘配置示例。
# 仅对已获得明确授权的目标使用；首次运行前请填写所有 YOUR_* 凭证。

# 本地任务数据库。每个流水线阶段均从此处读取并写入可续跑的结果。
database:
  url: sqlite:///data/assetmap.db

# 企业发现：采集控股关系、备案域名、App、公众号和小程序。
# 持股比例大于或等于阈值的企业会继续追踪；目标企业为第 0 层。
enterprise_discovery:
  tycid: YOUR_TYCID
  auth_token: YOUR_TYC_AUTH_TOKEN
  control_threshold: 0.47
  max_depth: 10

# 域名测绘：此阶段只有这两个用户参数。
# provider-config.yaml 单独保存外部平台密钥，真实文件不会提交到 Git。
domain_mapping:
  subfinder_provider_config: config/subfinder/provider-config.yaml
  # dnsx 使用项目内置的 30 万条精简高覆盖字典。工具内部保持 100 并发、600 请求/秒，
  # 并自动使用项目内置的阿里公共 DNS 与 DNSPod 递归 DNS 池。
  dnsx_wordlist: data/wordlists/Subdomain.txt

# 本地外部工具与主动测绘参数。
tools:
  # 唯一的主扫描命令：一次对全部目标 IP 执行全端口服务识别。
  # 支持占位符：{binary}、{targets_file}、{xml_output}、{normal_output}。
  # 单个版本识别脚本最多运行 60 秒；批量任务本身不设总时限。
  nmap_command: '{binary} -Pn -p- --open -sV --version-intensity 5 --min-hostgroup 16 --min-rate 500 --initial-rtt-timeout 300ms --max-rtt-timeout 2000ms --min-rtt-timeout 100ms --defeat-rst-ratelimit --max-retries 2 --script-timeout 60s -iL {targets_file} -oX {xml_output} -oN {normal_output}'

# 端口发现固定使用 Nmap 主动扫描与 FOFA 被动检索。
# 主动扫描只读取域名测绘阶段已确认的源站 IP，或用户手工确认的 IP。
# FOFA 的查询字段、结果数量和请求超时由程序固定管理。
fofa:
  email: YOUR_FOFA_EMAIL
  api_key: YOUR_FOFA_API_KEY

# OpenAI 兼容 AI 网关。深度模式默认开启；必须替换占位符密钥。
ai:
  enabled: true
  base_url: https://api.openai.com/v1
  api_key: YOUR_OPENAI_API_KEY
  api_key_header: Authorization
  model: gpt-4o
  timeout_seconds: 240

# Web 服务探测。ProjectDiscovery httpx 负责状态码、标题、技术指纹等识别；Python 只按批次编排和保存检查点。
web_probe:
  timeout_seconds: 8.0
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36

# Web 渲染 HTML 与文本智能识别。所有待处理页面固定按顺序处理，不设总量上限。
url_discovery:
  # 单个页面的常规打开超时；页面卡死时由硬超时回收。
  timeout_seconds: 15.0
  # 单个页面（含浏览器加载和 DOM 提取）的最长运行时间，不限制整个阶段的总时长。
  page_hard_timeout_seconds: 60
  # 单页 HTML/DOM 文本提交给 AI 的最长等待时间。
  ai_timeout_seconds: 240
