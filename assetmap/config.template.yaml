# assetmap 深度测绘配置。仅对已获授权的目标使用。
database:
  url: sqlite:///data/assetmap.db

# 企业发现：填写天眼查凭证与股权穿透边界。
enterprise_discovery:
  tycid: YOUR_TYCID
  auth_token: YOUR_TYC_AUTH_TOKEN
  control_threshold: 0.47
  max_depth: 10

# 域名测绘仅需配置 subfinder 的 Key 文件和 dnsx 字典。
domain_mapping:
  subfinder_provider_config: config/subfinder/provider-config.yaml
  dnsx_wordlist: data/wordlists/Subdomain.txt

tools:
  nmap_command: '{binary} -Pn -p- --open -sV --version-intensity 5 --min-hostgroup 16 --min-rate 500 --initial-rtt-timeout 300ms --max-rtt-timeout 2000ms --min-rtt-timeout 100ms --defeat-rst-ratelimit --max-retries 2 --script-timeout 60s -iL {targets_file} -oX {xml_output} -oN {normal_output}'

fofa:
  email: YOUR_FOFA_EMAIL
  api_key: YOUR_FOFA_API_KEY

ai:
  enabled: true
  base_url: https://api.openai.com/v1
  api_key: YOUR_OPENAI_API_KEY
  api_key_header: Authorization
  model: gpt-4o
  timeout_seconds: 240

web_probe:
  timeout_seconds: 8.0
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36

# Web 页面识别：所有待处理页面按顺序处理，不设总量上限。
url_discovery:
  # 单个页面的常规打开超时；页面发生卡死时由下面的硬超时回收。
  timeout_seconds: 15.0
  # 单个页面（含浏览器加载和 DOM 提取）的最长运行时间，不限制整个阶段的总时长。
  page_hard_timeout_seconds: 60
  # 单页 HTML/DOM 文本提交给 AI 的最长等待时间。
  ai_timeout_seconds: 240
