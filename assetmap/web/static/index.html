<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>assetmap 本机控制台</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .environment-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px; margin-top:14px; }
      .environment-item { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; background:#fff; border:1px solid #dfe6ee; border-left:4px solid #16855b; border-radius:10px; padding:13px 15px; font-size:13px; }
      .environment-item.missing { border-left-color:#bd7b11; }
      .environment-item p { margin:4px 0 0; color:#627184; }
      .environment-item small { display:block; margin-top:5px; color:#8b651c; line-height:1.4; }
      .small-action { border:1px solid #b7d6f6; border-radius:7px; background:#fff; color:#1976d2; padding:7px 9px; white-space:nowrap; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span><div><strong>assetmap</strong><small>本机资产测绘控制台</small></div></div>
        <nav>
          <button class="nav active" data-view="dashboard">概览</button>
          <button class="nav" data-view="scan">新建测绘</button>
          <button class="nav" data-view="tasks">任务中心</button>
          <button class="nav" data-view="settings">配置中心</button>
        </nav>
        <div class="local-note"><b>仅本机访问</b><span>控制台不会监听局域网或公网地址。</span></div>
      </aside>
      <main>
        <header><div><p class="eyebrow">资产测绘工作台</p><h1 id="page-title">准备开始</h1></div><button class="ghost" id="refresh">刷新状态</button></header>
        <div id="notice" class="notice hidden"></div>

        <section id="dashboard" class="view active">
          <div id="readiness" class="hero"></div>
          <div id="environment-list" class="environment-list"></div>
          <div class="section-heading"><div><h2>最近任务</h2><p>从上次停止的位置继续，不需要记住命令。</p></div><button class="primary" data-go="scan">开始新的测绘</button></div>
          <div id="task-cards" class="task-cards"></div>
        </section>

        <section id="scan" class="view">
          <div class="section-heading"><div><h2>新建测绘</h2><p>填写公司名称后，系统将按深度配置执行完整流程。</p></div></div>
          <form id="scan-form" class="panel wizard">
            <label class="full"><span>目标公司名称</span><input name="target" required placeholder="例如：苏州市能源发展集团有限公司" autocomplete="organization" /></label>
            <div class="info-row"><span>默认流程</span><b>企业发现 → 子域名/DNS → 端口 → Web → 报告 → 交付包</b></div>
            <label class="toggle"><input type="checkbox" name="refresh" /><span>重新采集，不复用同名历史任务</span></label>
            <label class="toggle"><input type="checkbox" name="no_ai" /><span>本次不运行子域名/DNS 的 AI 推理</span></label>
            <label class="toggle"><input type="checkbox" name="strict" /><span>严格模式：有质量警告时不生成交付包</span></label>
            <p class="helper">开始前会自动检查配置、密钥、工具、字典和浏览器；不满足条件时不会发起外部采集。</p>
            <button class="primary large" type="submit">开始深度测绘</button>
          </form>
          <div id="job-panel" class="job-panel hidden"></div>
        </section>

        <section id="tasks" class="view">
          <div class="section-heading"><div><h2>任务中心</h2><p>查看进度、恢复失败项，或下载已生成的交付包。</p></div></div>
          <div id="task-table" class="table-panel"></div>
        </section>

        <section id="settings" class="view">
          <div class="section-heading"><div><h2>配置中心</h2><p>所有运行参数都在这里分组展示。密钥不会回显；留空表示保留已保存的值。</p></div><button id="save-settings" class="primary">保存配置</button></div>
          <form id="settings-form" class="settings-form"></form>
        </section>
      </main>
    </div>
    <template id="field-template"><label class="field"><span></span><input /></label></template>
    <script src="/static/app.js"></script>
  </body>
</html>
