[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetmap"
version = "0.1.0"
description = "Internet digital asset exposure mapping CLI backed by ENScan Python collector"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "dnspython>=2.7,<2.8",
  "httpx>=0.28,<0.29",
  "openpyxl>=3.1.5,<3.2",
  "Pillow>=11.3,<12.0",
  "pydantic>=2.13,<2.14",
  "python-docx>=1.2,<1.3",
  "PyYAML>=6.0.3,<6.1",
  "requests>=2.32,<2.33",
  "sqlmodel>=0.0.34,<0.1",
  "typer>=0.23,<0.24",
  "questionary>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
]
visual = [
  "playwright>=1.60,<1.61",
]

[project.scripts]
assetmap = "assetmap.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["assetmap*"]
